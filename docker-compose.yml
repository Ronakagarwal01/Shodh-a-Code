version: '3.8'

services:
  # 1. PostgreSQL (Transactional Contest Data)
  postgres:
    image: postgres:16-alpine
    container_name: shodha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shodha_user
      POSTGRES_PASSWORD: shodha_secure_pass_2026
      POSTGRES_DB: shodha_code
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shodha_user -d shodha_code"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Job Queue & Realtime Leaderboard)
  redis:
    image: redis:7-alpine
    container_name: shodha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Qdrant (Semantic Vector Storage)
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: shodha-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. Neo4j (Curriculum Knowledge Graph & GraphRAG)
  neo4j:
    image: neo4j:5.26-community
    container_name: shodha-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/shodha_graph_pass_2026
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # 5. Contest Backend (NestJS)
  contest-api:
    build:
      context: ./contest-api
      dockerfile: ../docker/Dockerfile.contest-api
    container_name: shodha-contest-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://shodha_user:shodha_secure_pass_2026@postgres:5432/shodha_code
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "true"
      JWT_SECRET: super_secret_jwt_key_shodh_a_code_2026_at_least_32_chars
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 6. Judge Worker (BullMQ + Isolated Docker Sandbox)
  judge-worker:
    build:
      context: ./judge-worker
      dockerfile: ../docker/Dockerfile.judge-worker
    container_name: shodha-judge-worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONTEST_API_URL: http://contest-api:4000
      DOCKER_SANDBOX_IMAGE: python:3.11-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - contest-api

  # 7. AI Service (FastAPI + LangGraph + Hybrid + GraphRAG)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/Dockerfile.ai-service
    container_name: shodha-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 8000
      CONTEST_API_URL: http://contest-api:4000
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: shodha_graph_pass_2026
      LLM_PROVIDER: gemini
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - neo4j
      - contest-api

  # 8. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: shodha-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_CONTEST_API_URL: http://localhost:4000
      NEXT_PUBLIC_AI_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - contest-api
      - ai-service

volumes:
  pgdata:
  qdrant_data:
  neo4j_data:
